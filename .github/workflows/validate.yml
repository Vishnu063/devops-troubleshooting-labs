name: Validate drills and runnable labs
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: labs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  repository:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s tests -v
      - run: python3 scripts/validate.py
      - name: Generated files stay in sync
        run: |
          python3 scripts/build_docs.py
          python3 scripts/build_workflow.py
          git diff --exit-code
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: "005 — fault, repair, stability, reset"
        run: python3 scripts/ci_native.py docker --id 005
      - name: "006 — fault, repair, stability, reset"
        run: python3 scripts/ci_native.py docker --id 006
      - name: "010 — fault, repair, stability, reset"
        run: python3 scripts/ci_native.py docker --id 010
      - name: "012 — fault, repair, stability, reset"
        run: python3 scripts/ci_native.py docker --id 012
      - name: "019 — fault, repair, stability, reset"
        run: python3 scripts/ci_native.py docker --id 019
      - name: "020 — fault, repair, stability, reset"
        run: python3 scripts/ci_native.py docker --id 020
      - name: "021 — fault, repair, stability, reset"
        run: python3 scripts/ci_native.py docker --id 021
      - name: "033 — fault, repair, stability, reset"
        run: python3 scripts/ci_native.py docker --id 033
      - name: "049 — fault, repair, stability, reset"
        run: python3 scripts/ci_native.py docker --id 049
  kubernetes:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned kind binary
        run: |
          curl -fsSLo kind https://kind.sigs.k8s.io/dl/v0.27.0/kind-linux-amd64
          chmod +x kind
          sudo mv kind /usr/local/bin/kind
      - name: Create disposable cluster
        run: kind create cluster --name devops-labs --wait 120s
      - name: "023 — fault, repair, stability, reset"
        run: python3 scripts/ci_native.py kubernetes --id 023
      - name: "024 — fault, repair, stability, reset"
        run: python3 scripts/ci_native.py kubernetes --id 024
      - name: "025 — fault, repair, stability, reset"
        run: python3 scripts/ci_native.py kubernetes --id 025
      - name: "026 — fault, repair, stability, reset"
        run: python3 scripts/ci_native.py kubernetes --id 026
      - name: "027 — fault, repair, stability, reset"
        run: python3 scripts/ci_native.py kubernetes --id 027
      - name: "050 — fault, repair, stability, reset"
        run: python3 scripts/ci_native.py kubernetes --id 050
      - name: "051 — fault, repair, stability, reset"
        run: python3 scripts/ci_native.py kubernetes --id 051
      - name: "052 — fault, repair, stability, reset"
        run: python3 scripts/ci_native.py kubernetes --id 052
      - name: "054 — fault, repair, stability, reset"
        run: python3 scripts/ci_native.py kubernetes --id 054
      - name: "056 — fault, repair, stability, reset"
        run: python3 scripts/ci_native.py kubernetes --id 056
      - name: "057 — fault, repair, stability, reset"
        run: python3 scripts/ci_native.py kubernetes --id 057
      - name: "080 — fault, repair, stability, reset"
        run: python3 scripts/ci_native.py kubernetes --id 080
      - name: "081 — fault, repair, stability, reset"
        run: python3 scripts/ci_native.py kubernetes --id 081
      - name: "M01 — fault, repair, stability, reset"
        run: python3 scripts/ci_native.py kubernetes --id M01
      - name: "M02 — fault, repair, stability, reset"
        run: python3 scripts/ci_native.py kubernetes --id M02
      - name: "M03 — fault, repair, stability, reset"
        run: python3 scripts/ci_native.py kubernetes --id M03
      - name: Collect Kubernetes diagnostics on failure
        if: failure()
        run: |
          kubectl --context kind-devops-labs get pods -A -o wide || true
          kubectl --context kind-devops-labs get events -A --sort-by=.metadata.creationTimestamp || true
      - name: Delete disposable cluster
        if: always()
        run: kind delete cluster --name devops-labs
